<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meridian</title>
<meta name="description" content="Your daily Meridian news digest.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon-64.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meridian">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F7F9FC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1726" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@700;900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
  :root {
    --paper: #F7F9FC;
    --card: #FFFFFF;
    --ink: #14213D;
    --muted: #5B6575;
    --line: #DCE3EE;
    --blue: #0861DE;
    --red: #CC0000;
    --slate: #2E3A4F;
    --rule-faint: #C3CCDA;
    --shadow: 0 1px 2px rgba(20, 33, 61, .06), 0 6px 18px rgba(20, 33, 61, .06);
    --display: "Noto Sans Malayalam", system-ui, -apple-system, "Segoe UI", sans-serif;
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0E1726;
      --card: #142036;
      --ink: #E8EEF8;
      --muted: #9AA6B8;
      --line: #23324C;
      --blue: #3D8BF2;
      --red: #FF5A4F;
      --slate: #3A4762;
      --rule-faint: #33445F;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
  .sheet:focus { outline: none; }

  .wrap {
    max-width: 680px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 40px);
  }

  /* ---------- masthead ---------- */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; }
  .top img { height: 40px; width: auto; display: block; }
  .actions { display: flex; gap: 8px; }
  .iconbtn {
    width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--card);
    display: grid; place-items: center; cursor: pointer;
  }
  .iconbtn svg { width: 20px; height: 20px; stroke: var(--ink); fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .iconbtn.spin svg { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .dateline {
    font-family: var(--display); font-weight: 900;
    font-size: clamp(31px, 8.6vw, 46px); line-height: 1.02; letter-spacing: -0.015em;
    margin: 22px 0 10px;
  }
  .edition { margin: 0; color: var(--muted); font-size: 15px; }
  .edition b { color: var(--ink); font-weight: 600; }
  .offline { display: none; margin: 10px 0 0; color: var(--red); font-size: 14px; }
  .offline.show { display: block; }

  /* ---------- section tiles ---------- */
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 12px; margin: 26px 0 8px; }
  .tile { background: none; border: 0; padding: 0; cursor: pointer; text-align: center; }
  .tile .sq {
    aspect-ratio: 1; border-radius: 24%;
    display: grid; place-items: center;
    background: var(--c); box-shadow: var(--shadow);
    transition: transform .15s ease;
  }
  .tile:active .sq { transform: scale(.94); }
  .tile .sq svg { width: 46%; height: 46%; stroke: #fff; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .tile .name { display: block; margin-top: 7px; font-size: 14px; font-weight: 600; }
  .tile .count { display: block; font-size: 13px; color: var(--muted); }

  /* ---------- sections ---------- */
  section.sec { margin-top: 40px; scroll-margin-top: 16px; }
  .sechead { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .sechead .mini { width: 34px; height: 34px; border-radius: 24%; background: var(--c); display: grid; place-items: center; flex: none; }
  .sechead .mini svg { width: 19px; height: 19px; stroke: #fff; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .sechead h2 { margin: 0; font-family: var(--display); font-weight: 900; font-size: 25px; letter-spacing: -0.01em; line-height: 1.1; flex: 1; }
  .sechead .n { color: var(--muted); font-size: 14px; }

  /* the meridian rule: weight shows how many outlets covered the story */
  .story { position: relative; padding: 18px 0 18px 22px; border-bottom: 1px solid var(--line); }
  .story:last-of-type { border-bottom: 0; }
  .story::before {
    content: ""; position: absolute; left: 0; top: 20px; bottom: 20px;
    width: var(--rw, 2px); border-radius: 3px; background: var(--rc, var(--rule-faint));
  }
  .story.c1 { --rw: 2px; --rc: var(--rule-faint); }
  .story.c2 { --rw: 3px; --rc: color-mix(in srgb, var(--blue) 55%, transparent); }
  .story.c3 { --rw: 5px; --rc: var(--blue); }
  .story.c4 { --rw: 7px; --rc: var(--blue); }
  .story h3 { margin: 0 0 6px; font-size: 18px; line-height: 1.3; font-weight: 700; letter-spacing: -0.005em; }
  .story h3 .star { display: inline-block; width: 16px; height: 16px; margin-right: 6px; vertical-align: -1px; fill: var(--red); }
  .story p { margin: 0; font-family: var(--serif); font-size: 16.5px; line-height: 1.6; color: color-mix(in srgb, var(--ink) 86%, var(--muted)); max-width: 62ch; }

  .cov {
    margin-top: 10px; background: none; border: 0; padding: 6px 0; cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 14px;
  }
  .cov svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; transition: transform .2s ease; }
  .cov[aria-expanded="true"] svg { transform: rotate(180deg); }
  .srcs { list-style: none; margin: 4px 0 0; padding: 0; display: none; }
  .srcs.open { display: block; }
  .srcs li a {
    display: flex; justify-content: space-between; gap: 12px; align-items: baseline;
    padding: 9px 12px; margin: 4px 0; border-radius: 10px;
    background: var(--card); border: 1px solid var(--line); text-decoration: none; font-size: 15px;
  }
  .srcs li a span { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55%; }
  .srcs li:first-child a { border-color: color-mix(in srgb, var(--blue) 45%, var(--line)); }

  .more {
    width: 100%; margin-top: 10px; padding: 12px; border-radius: 12px; cursor: pointer;
    background: var(--card); border: 1px solid var(--line); font-weight: 600; font-size: 15px;
  }
  .hidden { display: none !important; }  /* must beat .sheet .go and friends */

  .note { margin: 40px 0 0; padding: 22px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); }
  .note h2 { margin: 0 0 6px; font-family: var(--display); font-weight: 900; font-size: 22px; }
  .note p { margin: 0 0 14px; color: var(--muted); }
  .note code { font-size: 14px; word-break: break-all; }

  footer { margin-top: 48px; color: var(--muted); font-size: 13px; text-align: center; }

  /* skeleton while the first load is in flight */
  .skel { margin-top: 30px; }
  .skel div { height: 14px; border-radius: 7px; background: var(--line); margin: 12px 0; }
  .skel div:nth-child(3n+1) { width: 72%; height: 18px; margin-top: 26px; }

  /* ---------- bottom sheet ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(14, 23, 38, .45); opacity: 0; pointer-events: none; transition: opacity .2s ease; z-index: 10; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 11;
    margin: 0 auto; max-width: 520px;
    background: var(--card); border-radius: 24px 24px 0 0;
    padding: 30px 24px calc(env(safe-area-inset-bottom) + 24px);
    text-align: center; box-shadow: 0 -10px 40px rgba(0, 0, 0, .18);
    transform: translateY(105%); transition: transform .28s cubic-bezier(.2, .8, .2, 1);
  }
  .sheet.open { transform: none; }
  .sheet .x { position: absolute; top: 12px; right: 12px; border: 0; background: none; width: 44px; height: 44px; cursor: pointer; border-radius: 50%; }
  .sheet .x svg { width: 20px; height: 20px; stroke: var(--muted); stroke-width: 2; fill: none; stroke-linecap: round; }
  .sheet .emoji { font-size: 58px; line-height: 1; }
  .sheet h2 { margin: 16px 0 8px; font-family: var(--display); font-weight: 900; font-size: 26px; line-height: 1.15; }
  .sheet p { margin: 0 auto; max-width: 34ch; color: var(--muted); font-size: 16px; }
  .sheet .go {
    display: block; width: 100%; margin-top: 22px; padding: 15px; border: 0; border-radius: 14px; cursor: pointer;
    background: var(--blue); color: #fff; font-weight: 700; font-size: 17px;
  }
  .sheet .later { margin-top: 6px; padding: 12px; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 15px; }
  .bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; margin: 22px auto 0; max-width: 240px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--blue); transition: width 1s linear; }

  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 22px); z-index: 12;
    transform: translate(-50%, calc(100% + 40px)); visibility: hidden;
    transition: transform .3s cubic-bezier(.2, .8, .2, 1), visibility 0s linear .3s;
    background: var(--ink); color: var(--paper); padding: 12px 18px; border-radius: 999px; font-weight: 600; font-size: 15px;
    white-space: nowrap;
  }
  .toast.show { transform: translate(-50%, 0); visibility: visible; transition: transform .3s cubic-bezier(.2, .8, .2, 1); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <img id="logo" alt="Meridian" src="meridian-01.png">
    <div class="actions">
      <button class="iconbtn" id="refresh" aria-label="Check for a new edition">
        <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
      </button>
      <button class="iconbtn" id="sendbtn" aria-label="Send a fresh edition">
        <svg viewBox="0 0 24 24"><path d="M21 3 10 14"/><path d="M21 3 14.5 21l-4.5-7-7-4.5Z"/></svg>
      </button>
    </div>
  </header>

  <h1 class="dateline" id="dateline">Meridian</h1>
  <p class="edition" id="edition">Loading today's edition…</p>
  <p class="offline" id="offline">Can't reach the server - showing your last saved edition.</p>

  <nav class="tiles" id="tiles" aria-label="Sections"></nav>
  <main id="feed"><div class="skel"><div></div><div></div><div></div><div></div><div></div><div></div></div></main>

  <footer id="foot">Meridian, made in Bristol, RI</footer>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1">
  <button class="x" id="sheetX" aria-label="Close">
    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </button>
  <div class="emoji" id="sheetEmoji">🧭</div>
  <h2 id="sheetTitle"></h2>
  <p id="sheetBody"></p>
  <div class="bar hidden" id="sheetBar"><i id="sheetBarFill"></i></div>
  <button class="go hidden" id="sheetGo"></button>
  <button class="later hidden" id="sheetLater">Not now</button>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  "use strict";

  // ---------- config & key ----------
  const API = (window.MERIDIAN_API || "").trim();
  const params = new URLSearchParams(location.search);
  const store = {
    get(k) { try { return localStorage.getItem("meridian:" + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem("meridian:" + k, v); } catch (e) {} },
  };
  const KEY = params.get("k") || store.get("key");
  if (params.get("k")) store.set("key", params.get("k"));

  const STALE_HOURS = 5;          // offer a fresh edition when the latest is older than this
  const POLL_EVERY = 30 * 1000;   // after a send, check for the new edition this often
  const POLL_FOR = 12 * 60 * 1000;

  // ---------- section icons (drawn on a 24-unit grid, white strokes on a colored tile) ----------
  const ICONS = {
    globe: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18M4.6 7.5h14.8M4.6 16.5h14.8"/></svg>',
    football: '<svg viewBox="0 0 24 24"><path d="M5.2 18.8C3 16.6 3.6 10.3 7 7s9.6-4 11.8-1.8S20.4 13.7 17 17s-9.6 4-11.8 1.8Z"/><path d="M9.5 14.5l5-5M10.6 11.4l2 2M12.1 9.9l2 2M9.1 12.9l2 2"/></svg>',
    chip: '<svg viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="1.6"/><rect x="9.5" y="9.5" width="5" height="5" rx=".6"/><path d="M9.5 3v3.5M14.5 3v3.5M9.5 17.5V21M14.5 17.5V21M3 9.5h3.5M3 14.5h3.5M17.5 9.5H21M17.5 14.5H21"/></svg>',
    atom: '<svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9.5" ry="3.8"/><ellipse cx="12" cy="12" rx="9.5" ry="3.8" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="9.5" ry="3.8" transform="rotate(120 12 12)"/><circle cx="12" cy="12" r="1.3" fill="#fff"/></svg>',
    chart: '<svg viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M6.5 20v-5M11 20v-8M15.5 20v-6"/><path d="M5 10.5 10 6l3.5 3L19.5 3.5"/><path d="M15.5 3.5h4v4"/></svg>',
    lighthouse: '<svg viewBox="0 0 24 24"><path d="M9.6 9h4.8l1.4 12H8.2Z"/><path d="M9 9V6.5h6V9M10.3 6.5 12 4l1.7 2.5"/><path d="M8.8 14.5h6.4"/><path d="M15.5 7.2 21 5.5M15.5 7.8l5.5 1.7M8.5 7.2 3 5.5M8.5 7.8 3 9.5"/><path d="M6 21h12"/></svg>',
  };
  const TILE_COLOR = {
    globe: "var(--blue)", football: "var(--red)", chip: "var(--slate)",
    atom: "var(--blue)", chart: "var(--red)", lighthouse: "var(--slate)",
  };
  const STAR = '<svg class="star" viewBox="0 0 24 24" aria-label="Top story" role="img"><path d="M12 2.5l2.9 6.2 6.6.7-4.9 4.5 1.4 6.6L12 17.2l-5.9 3.3 1.4-6.6-4.9-4.5 6.6-.7Z"/></svg>';
  const CHEVRON = '<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>';
  const SHOW_FIRST = 3;

  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };

  // ---------- data ----------
  let current = null;

  async function api(action) {
    const u = new URL(API);
    u.searchParams.set("action", action);
    u.searchParams.set("k", KEY);
    u.searchParams.set("t", Date.now());
    const r = await fetch(u.toString(), { redirect: "follow", cache: "no-store" });
    if (!r.ok) throw new Error("Server answered " + r.status);
    return r.json();
  }

  function cached() {
    try { return JSON.parse(store.get("data") || "null"); } catch (e) { return null; }
  }

  async function load({ quiet = false } = {}) {
    if (!quiet) $("refresh").classList.add("spin");
    try {
      const r = await api("data");
      $("offline").classList.remove("show");
      if (!r.ok) {
        if (r.status === "unauthorized") return showNote("lock");
        if (!current) return showNote("empty", r.message);
        return null;
      }
      store.set("data", JSON.stringify(r.data));
      const isNew = !current || Date.parse(r.data.generated) > Date.parse(current.generated);
      if (isNew) render(r.data);
      return r.data;
    } catch (e) {
      if (current) $("offline").classList.add("show");
      else showNote("offline");
      return null;
    } finally {
      $("refresh").classList.remove("spin");
    }
  }

  // ---------- rendering ----------
  function dayOfYear(d) {
    return Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(d.getFullYear(), 0, 0)) / 864e5);
  }
  function setLogo(d) {
    // same rotation as the email: 8 variants, picked by day of year
    $("logo").src = "meridian-0" + ((dayOfYear(d) % 8) + 1) + ".png";
  }
  function coverageClass(n) { return n >= 6 ? "c4" : n >= 4 ? "c3" : n >= 2 ? "c2" : "c1"; }
  function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : null; }
  function timeOf(d) { return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); }
  function ago(ms) {
    const h = ms / 36e5;
    if (h < 1) return Math.max(1, Math.round(ms / 6e4)) + " minutes";
    const r = Math.round(h);
    return r + (r === 1 ? " hour" : " hours");
  }

  function render(data) {
    current = data;
    const gen = new Date(data.generated);
    setLogo(gen);
    $("dateline").textContent = gen.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });
    const ed = $("edition");
    ed.textContent = "";
    const label = data.edition === "on-demand" ? "On-demand edition" : "Morning edition";
    ed.append(el("b", null, label), document.createTextNode(", " + timeOf(gen) + ". "));
    const s = data.stats || {};
    ed.append(document.createTextNode(
      (s.stories || 0) + " stories from " + (s.articles || 0).toLocaleString() + " articles across " + (s.outlets || 0) + " outlets."));

    // the day's biggest story gets the star
    let top = null;
    for (const sec of data.sections) for (const st of sec.stories) if (!top || st.n > top.n) top = st;

    const tiles = $("tiles"), feed = $("feed");
    tiles.textContent = ""; feed.textContent = "";

    data.sections.forEach((sec, i) => {
      const icon = ICONS[sec.icon] ? sec.icon : Object.keys(ICONS)[i % 6];
      const color = TILE_COLOR[icon];

      const t = el("button", "tile");
      t.style.setProperty("--c", color);
      t.setAttribute("aria-label", sec.label + ", " + sec.stories.length + " stories");
      const sq = el("span", "sq"); sq.innerHTML = ICONS[icon];
      t.append(sq, el("span", "name", sec.label), el("span", "count", sec.stories.length + (sec.stories.length === 1 ? " story" : " stories")));
      t.addEventListener("click", () => openSection(sec.key));
      tiles.append(t);

      const block = el("section", "sec"); block.id = "sec-" + sec.key;
      block.style.setProperty("--c", color);
      const head = el("div", "sechead");
      const mini = el("span", "mini"); mini.innerHTML = ICONS[icon];
      head.append(mini, el("h2", null, sec.label), el("span", "n", String(sec.stories.length)));
      block.append(head);

      if (!sec.stories.length) block.append(el("p", "edition", "Nothing big enough here today."));

      sec.stories.forEach((st, j) => {
        const a = el("article", "story " + coverageClass(st.n) + (j >= SHOW_FIRST ? " hidden extra" : ""));
        const h = el("h3");
        if (st === top) h.innerHTML = STAR;
        h.append(document.createTextNode(st.h));
        a.append(h);
        if (st.s) a.append(el("p", null, st.s));

        const links = (st.src || []).filter((x) => safeUrl(x[1]));
        if (links.length) {
          const id = "src-" + sec.key + "-" + j;
          const btn = el("button", "cov");
          btn.setAttribute("aria-expanded", "false");
          btn.setAttribute("aria-controls", id);
          btn.append(document.createTextNode(
            links.length === 1 ? "Read at " + links[0][0] : "Covered by " + st.n + " outlets"));
          btn.insertAdjacentHTML("beforeend", CHEVRON);
          const ul = el("ul", "srcs"); ul.id = id;
          for (const [name, url] of links) {
            const li = el("li"), link = el("a");
            link.href = safeUrl(url); link.target = "_blank"; link.rel = "noopener";
            let host = ""; try { host = new URL(url).hostname.replace(/^www\./, ""); } catch (e) {}
            link.append(document.createTextNode(name), el("span", null, host));
            li.append(link); ul.append(li);
          }
          btn.addEventListener("click", () => {
            const open = btn.getAttribute("aria-expanded") === "true";
            if (links.length === 1 && !open) { window.open(safeUrl(links[0][1]), "_blank", "noopener"); return; }
            btn.setAttribute("aria-expanded", String(!open));
            ul.classList.toggle("open", !open);
          });
          a.append(btn, ul);
        }
        block.append(a);
      });

      const extra = sec.stories.length - SHOW_FIRST;
      if (extra > 0) {
        const more = el("button", "more", "Show " + extra + " more");
        more.setAttribute("aria-expanded", "false");
        more.addEventListener("click", () => toggleMore(block, more, extra));
        block.append(more);
      }
      feed.append(block);
    });

    $("foot").textContent = "Meridian, made in Bristol, RI. Checked " + timeOf(new Date()) + ".";
  }

  function toggleMore(block, btn, extra, force) {
    const open = force != null ? force : btn.getAttribute("aria-expanded") !== "true";
    block.querySelectorAll(".extra").forEach((n) => n.classList.toggle("hidden", !open));
    btn.setAttribute("aria-expanded", String(open));
    btn.textContent = open ? "Show fewer" : "Show " + extra + " more";
  }

  function openSection(key) {
    const block = $("sec-" + key);
    if (!block) return;
    const more = block.querySelector(".more");
    if (more) toggleMore(block, more, block.querySelectorAll(".extra").length, true);
    block.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  }

  function showNote(kind, detail) {
    const feed = $("feed");
    feed.textContent = "";
    $("tiles").textContent = "";
    const n = el("div", "note");
    if (kind === "setup") {
      n.append(el("h2", null, "Almost there"),
        el("p", null, "Paste your Apps Script web app URL into config.js, then reopen this page."));
      $("edition").textContent = "Not connected yet.";
    } else if (kind === "lock") {
      n.append(el("h2", null, "🔒 This link is missing its key"),
        el("p", null, "Open the app once using your full link that ends in ?k=… - after that it remembers."));
      $("edition").textContent = "Not connected.";
    } else if (kind === "empty") {
      n.append(el("h2", null, "No edition yet"),
        el("p", null, detail || "Your first edition appears after the next digest runs."));
      const go = el("button", "more", "Send one now");
      go.addEventListener("click", () => openSheet("confirm"));
      n.append(go);
      $("edition").textContent = "Waiting for the first edition.";
    } else {
      n.append(el("h2", null, "Can't reach the server"),
        el("p", null, "Check your connection and pull down or tap refresh to try again."));
      $("edition").textContent = "Offline.";
    }
    feed.append(n);
  }

  // ---------- send sheet ----------
  let pollTimer = null;

  function sheetState({ emoji, title, body, go, later, bar }) {
    $("sheetEmoji").textContent = emoji;
    $("sheetTitle").textContent = title;
    $("sheetBody").textContent = body;
    $("sheetGo").classList.toggle("hidden", !go);
    if (go) $("sheetGo").textContent = go;
    $("sheetLater").classList.toggle("hidden", !later);
    $("sheetBar").classList.toggle("hidden", !bar);
  }

  function openSheet(mode, hours) {
    if (mode === "prompt") {
      sheetState({
        emoji: "🧭",
        title: "Your last Meridian was " + hours + " ago",
        body: "Send a fresh edition? It lands here and in your inbox in about five minutes.",
        go: "Send a fresh edition", later: true,
      });
    } else {
      sheetState({
        emoji: "🧭", title: "Send a fresh edition?",
        body: "It lands here and in your inbox in about five minutes.",
        go: "Send a fresh edition", later: true,
      });
    }
    $("scrim").classList.add("open");
    $("sheet").classList.add("open");
    $("sheet").focus({ preventScroll: true });   // dialog gets focus; no ring on the button
  }

  function closeSheet() {
    $("scrim").classList.remove("open");
    $("sheet").classList.remove("open");
  }

  async function sendNow() {
    sheetState({ emoji: "🧭", title: "Sending your Meridian", body: "Asking for a fresh edition…" });
    let r;
    try { r = await api("send"); }
    catch (e) { r = { ok: false, status: "error", message: "Couldn't reach the server. Check your connection and try again." }; }

    if (r.status === "sent" || r.status === "cooldown") {
      store.set("sentAt", String(Date.now()));
      sheetState(r.status === "sent"
        ? { emoji: "🧭", title: "Sending your Meridian", body: "It lands here and in your inbox in about five minutes. You can close this - the app updates on its own.", bar: true }
        : { emoji: "📬", title: "Already on its way", body: "You asked a moment ago. The app will update when it lands.", bar: true });
      startPolling();
    } else if (r.status === "unauthorized") {
      sheetState({ emoji: "🔒", title: "Not authorized", body: "This link is missing its key. Open the app with your full link that ends in ?k=…" });
    } else {
      sheetState({ emoji: "⚠️", title: "That didn't go through", body: r.message || "Something went wrong. Try again in a minute.", go: "Try again" });
    }
  }

  function startPolling() {
    clearInterval(pollTimer);
    const started = Date.now();
    const before = current ? Date.parse(current.generated) : 0;
    const fill = $("sheetBarFill");
    fill.style.width = "0";
    let lastPoll = Date.now(), busy = false;
    pollTimer = setInterval(async () => {
      const elapsed = Date.now() - started;
      // the bar tracks the usual ~5 minute run, then holds near the end until the edition lands
      fill.style.width = Math.min(92, (elapsed / (5 * 60 * 1000)) * 92) + "%";
      if (!busy && (Date.now() - lastPoll >= POLL_EVERY || elapsed > POLL_FOR)) {
        busy = true; lastPoll = Date.now();
        const d = await load({ quiet: true });
        busy = false;
        if (d && Date.parse(d.generated) > before) {
          clearInterval(pollTimer);
          fill.style.width = "100%";
          closeSheet();
          toast("New edition loaded");
          window.scrollTo({ top: 0, behavior: "smooth" });
        } else if (elapsed > POLL_FOR) {
          clearInterval(pollTimer);
          sheetState({ emoji: "📬", title: "Still on its way", body: "This one's taking longer than usual. Check your inbox, or tap refresh in a few minutes." });
        }
      }
    }, 1000);
  }

  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2600);
  }

  function maybePrompt(data) {
    if (!data || !data.generated) return;
    const age = Date.now() - Date.parse(data.generated);
    const sentAt = Number(store.get("sentAt") || 0);
    const recentlyAsked = Date.now() - sentAt < 15 * 60 * 1000;
    if (age > STALE_HOURS * 36e5 && !recentlyAsked) openSheet("prompt", ago(age));
  }

  // ---------- wiring ----------
  $("sheetGo").addEventListener("click", sendNow);
  $("sheetLater").addEventListener("click", closeSheet);
  $("sheetX").addEventListener("click", closeSheet);
  $("scrim").addEventListener("click", closeSheet);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });
  $("sendbtn").addEventListener("click", () => openSheet("confirm"));
  $("refresh").addEventListener("click", async () => {
    const before = current && current.generated;
    const d = await load();
    if (d) toast(d.generated !== before ? "New edition loaded" : "You're up to date");
  });
  // coming back to the app after a while counts as opening it
  document.addEventListener("visibilitychange", async () => {
    if (document.visibilityState === "visible" && API && KEY) {
      const d = await load({ quiet: true });
      if (!$("sheet").classList.contains("open")) maybePrompt(d || current);
    }
  });

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

  // ---------- start ----------
  setLogo(new Date());
  if (!API || API.includes("PASTE")) { showNote("setup"); return; }
  if (!KEY) { showNote("lock"); return; }
  const saved = cached();
  if (saved) render(saved);           // instant paint from the last edition, then refresh
  load().then((d) => maybePrompt(d || current));
})();
</script>
</body>
</html>
